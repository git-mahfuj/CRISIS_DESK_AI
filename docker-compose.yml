version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crisisdesk_backend
    ports:
      - "3000:3000"   
    environment:          
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MONGO_URI=${MONGO_URI}
    restart: unless-stopped

  frontend:              
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend